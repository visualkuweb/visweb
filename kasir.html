// ==================== UTILITIES ====================
const formatCurrency = (n) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(n || 0);
const formatDate = (d) => { if (!d) return '-'; const date = typeof d === 'string' ? new Date(d) : d; return date.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }); };
const genId = () => Math.random().toString(36).substr(2, 9);
const generateOrderNumber = () => {
  const today = new Date();
  const dateStr = today.getDate().toString().padStart(2, '0') + (today.getMonth() + 1).toString().padStart(2, '0') + today.getFullYear().toString().slice(-2);
  const randomNum = Math.floor(10000 + Math.random() * 90000);
  return `VMMP-${randomNum}${dateStr}`;
};
const formatWhatsAppNumber = (number) => {
  let formatted = number.replace(/\D/g, '');
  if (formatted.startsWith('0')) formatted = '62' + formatted.slice(1);
  else if (!formatted.startsWith('62')) formatted = '62' + formatted;
  return formatted;
};

// ==================== FORM CONTEXT (GLOBAL STATE - TIDAK HILANG SAAT PINDAH TAB) ====================
const FormContext = createContext();

const FormProvider = ({ children }) => {
  const initialFormState = {
    orderNumber: generateOrderNumber(),
    orderType: '',
    customer: { name: '', whatsapp: '', address: '', city: '' },
    orderItems: [],
    totalPrice: '',
    editingItemId: null,
    item: { category: '', sizeLength: '', sizeWidth: '', yBannerSize: '', aBannerSize: '', kalenderSize: '', notes: '', quantity: '', unit: '', design: '' }
  };

  const [formData, setFormData] = useState(initialFormState);

  const updateCustomer = (data) => setFormData(prev => ({ ...prev, customer: { ...prev.customer, ...data } }));
  const updateItem = (data) => setFormData(prev => ({ ...prev, item: { ...prev.item, ...data } }));
  const setOrderType = (type) => setFormData(prev => ({ ...prev, orderType: type }));
  const setTotalPrice = (price) => setFormData(prev => ({ ...prev, totalPrice: price }));
  const setOrderNumber = (num) => setFormData(prev => ({ ...prev, orderNumber: num }));

  const addItem = (newItem) => {
    setFormData(prev => {
      const items = prev.editingItemId 
        ? prev.orderItems.map(i => i.id === prev.editingItemId ? newItem : i)
        : [...prev.orderItems, newItem];
      return { 
        ...prev, 
        orderItems: items, 
        editingItemId: null,
        item: { category: '', sizeLength: '', sizeWidth: '', yBannerSize: '', aBannerSize: '', kalenderSize: '', notes: '', quantity: '', unit: '', design: '' }
      };
    });
  };

  const removeItem = (id) => setFormData(prev => ({ 
    ...prev, 
    orderItems: prev.orderItems.filter(i => i.id !== id),
    editingItemId: prev.editingItemId === id ? null : prev.editingItemId
  }));

  const setEditingItem = (id, itemData) => setFormData(prev => ({ ...prev, editingItemId: id, item: itemData }));

  const resetForm = () => setFormData({
    ...initialFormState,
    orderNumber: generateOrderNumber()
  });

  return (
    <FormContext.Provider value={{ 
      formData, updateCustomer, updateItem, setOrderType, setTotalPrice, setOrderNumber, 
      addItem, removeItem, setEditingItem, resetForm 
    }}>
      {children}
    </FormContext.Provider>
  );
};

const FormPage = () => {

  const handlePrintingCategoryChange = (cat) => updateItem({ category: cat, sizeLength: '', sizeWidth: '', yBannerSize: '', aBannerSize: '', kalenderSize: '' });

  const handleAddItem = () => {
    if (!customer.name || !customer.address || !customer.city || !customer.whatsapp) return toast('Lengkapi data pemesan!', 'error');
    if (!orderType) return toast('Pilih tipe pesanan!', 'error');
    let size = '';
    if (orderType === 'printing') {
      if (!item.category) return toast('Pilih kategori item!', 'error');
      if (item.category === 'Banner/Spanduk') size = `${item.sizeLength}x${item.sizeWidth} cm`;
      else if (item.category === 'Stand Banner Y/Rollup') size = item.yBannerSize;
      else if (item.category === 'A Banner Kayu') size = item.aBannerSize;
      else if (item.category === 'Kalender') size = item.kalenderSize;
    }
    if (!item.quantity || !item.unit || !item.design) return toast('Lengkapi jumlah, satuan, dan desain!', 'error');
    
    const newItem = { 
      id: editingItemId || Date.now(), 
      type: orderType, 
      category: orderType === 'printing' ? item.category : 'Jasa Desain', 
      size, 
      notes: item.notes, 
      quantity: item.quantity, 
      unit: item.unit, 
      design: item.design

    contextAddItem(newItem);

  const resetForm = () => {
    contextResetForm();

  };

    let itemsText = orderItems.map((it, i) => `${i+1}. ${it.category} ${it.size ? '('+it.size+')' : ''}\n   Qty: ${it.quantity} ${it.unit}`).join('\n');

    if (type === 'konfirmasi') await db.collection('orders').doc(savedOrder.id).update({ status: 'lunas', paidAt: new Date().toISOString(), updatedAt: new Date().toISOString() });
    window.open(`https://wa.me/${wa}?text=${encodeURIComponent(msg)}`, '_blank');
    toast(type === 'tagihan' ? 'Tagihan terkirim!' : type === 'konfirmasi' ? 'Konfirmasi terkirim! Status LUNAS' : 'Ucapan terima kasih terkirim!', 'success');

                <option value="">Pilih Kota...</option>
                {cities.map(c => <option key={c} value={c} className="bg-white dark:bg-slate-800">{c}</option>)}

        </CardContent>
      </Card>
      <Card>
        <CardHeader><CardTitle>Tipe Pesanan</CardTitle></CardHeader>

// 2. KASIR PRINTING PAGE
const KasirPage = () => {
  const { toast } = useContext(ToastContext);
  const { setCurrentPage } = useContext(UIContext);
  const { setTotalPrice } = useContext(FormContext); // <-- Mengambil fungsi untuk update harga di Form
  
  const [settings, setSettings] = useState({ normal: 35000, express: 45000, desain: 0 });
  const [showPrices, setShowPrices] = useState({ normal: false, express: false });
  const [items, setItems] = useState([{ id: genId(), jenis: 'Normal', lebar: '', tinggi: '', qty: 1 }]);
  const [showMarginPopup, setShowMarginPopup] = useState(false);

  const HARGA_TETAP = { "Y Banner": 160000, "Roll Banner": 450000 };
  const MODAL = { "Normal": 17000, "Express": 35000, "Y Banner": 80000, "Roll Banner": 300000 };
  const UKURAN_FIXED = { "Y Banner": { lebar: 60, tinggi: 160 }, "Roll Banner": { lebar: 60, tinggi: 160 } };

  const roundUpTo50 = (val) => {
    if (val <= 0) return 0;
    const rounded = Math.ceil(val / 50) * 50;
    return rounded < 100 ? 100 : rounded;
  };

  const addItem = () => setItems([...items, { id: genId(), jenis: 'Normal', lebar: '', tinggi: '', qty: 1 }]);
  const removeItem = (id) => setItems(items.filter(i => i.id !== id));
  const updateItem = (id, field, value) => setItems(items.map(i => i.id === id ? { ...i, [field]: value } : i));

  const calculations = useMemo(() => {
    let totalItem = items.length;
    let totalLuasExact = 0;
    let totalJualBanner = 0;
    let totalModal = 0;
    let detailRows = [];

    items.forEach((item, idx) => {
      const isFixed = item.jenis === 'Y Banner' || item.jenis === 'Roll Banner';
      const qty = parseFloat(item.qty) || 0;
      const modalSatuan = MODAL[item.jenis];
      const modalBaris = qty * modalSatuan;
      totalModal += modalBaris;

      let jualBaris = 0;
      let infoUkuran = "";
      let luasExact = 0;

      if (isFixed) {
        jualBaris = qty * HARGA_TETAP[item.jenis];
        const ukuran = UKURAN_FIXED[item.jenis];
        infoUkuran = `${ukuran.lebar}×${ukuran.tinggi} cm (fixed)`;
      } else {
        const l = parseFloat(item.lebar) || 0;
        const t = parseFloat(item.tinggi) || 0;
        luasExact = (l / 100) * (t / 100) * qty;
        totalLuasExact += luasExact;
        
        const lRound = roundUpTo50(l);
        const tRound = roundUpTo50(t);
        const luasRounded = (lRound / 100) * (tRound / 100) * qty;
        
        const hargaPerM2 = item.jenis === 'Normal' ? (parseFloat(settings.normal) || 0) : (parseFloat(settings.express) || 0);
        jualBaris = luasRounded * hargaPerM2;
        infoUkuran = `${l}×${t} cm → ${lRound}×${tRound} cm | ${luasExact.toFixed(2)} m² (abs) / ${luasRounded.toFixed(2)} m² (bill)`;
      }

      totalJualBanner += jualBaris;
      detailRows.push({ idx: idx + 1, jenis: item.jenis, qty, infoUkuran, jualBaris, modalBaris });
    });

    const grandTotalJual = totalJualBanner + (parseFloat(settings.desain) || 0);
    const untung = grandTotalJual - totalModal;
    const margin = grandTotalJual > 0 ? ((untung / grandTotalJual) * 100).toFixed(1) : 0;

    return { totalItem, totalLuasExact, totalJualBanner, totalModal, grandTotalJual, untung, margin, detailRows };
  }, [items, settings]);

  const handleDownload = () => {
    const { totalModal, grandTotalJual, untung, margin, detailRows } = calculations;
    const desain = parseFloat(settings.desain) || 0;
    let detailText = "";
    detailRows.forEach(row => {
      detailText += `${row.idx}. ${row.jenis} ${row.infoUkuran.split('|')[0].replace(' cm (fixed)', '')} × ${row.qty} = ${formatCurrency(row.jualBaris)} | Modal: ${formatCurrency(row.modalBaris)}\n`;
    });

    const text = `RINCIAN MARGIN KEUNTUNGAN (INTERNAL)\n====================================\nTanggal: ${new Date().toLocaleString('id-ID')}\n\nDETAIL ITEM:\n${detailText}\n====================================\nTotal Modal      : ${formatCurrency(totalModal)}\nBiaya Desain     : ${formatCurrency(desain)}\nTotal Tagihan    : ${formatCurrency(grandTotalJual)}\nKeuntungan Bersih: ${formatCurrency(untung)}\nMargin           : ${margin}%\n====================================`;

    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Rincian_Margin_${Date.now()}.txt`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    window.URL.revokeObjectURL(url);
    toast('File rincian berhasil diunduh!', 'success');
  };

  const openMarginPopup = () => {
    const pass = prompt("Masukkan Password untuk melihat Margin:");
    if (pass === "3000") setShowMarginPopup(true);
    else toast("Password salah! Akses ditolak.", "error");
  };

  // FUNGSI BARU: Terapkan harga ke Form dan kembali
  const applyPriceToForm = () => {
    const finalPrice = calculations.grandTotalJual;
    if (finalPrice <= 0) {
      toast('Tidak ada total harga yang bisa diterapkan!', 'error');
      return;
    }
    setTotalPrice(finalPrice.toString()); // Update global state Form
    setCurrentPage('form'); // Pindah tab otomatis
    toast(`Total ${formatCurrency(finalPrice)} berhasil diterapkan ke Form Pesanan!`, 'success');
  };

  return (
    <div className="space-y-6 max-w-5xl mx-auto animate-fadeInUp">
      <div>
        <h1 className="text-3xl font-bold text-slate-900 dark:text-white mb-2">🧮 Kasir Printing</h1>
        <p className="text-slate-500 dark:text-slate-400">Kalkulasi harga sistem Update 2026 - 2027</p>
      </div>

      <Card>
        <CardHeader><CardTitle>Pengaturan Global</CardTitle></CardHeader>
        <CardContent>
          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div className="input-underline">
              <Label>Harga Normal / m²</Label>
              <div className="relative">
                <Input type="number" value={settings.normal} onChange={e => setSettings({...settings, normal: e.target.value})} className={`pr-10 ${!showPrices.normal ? 'masked-text' : ''}`} />
                <button onClick={() => setShowPrices({...showPrices, normal: !showPrices.normal})} className="absolute right-2 top-1/2 -translate-y-1/2 text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 transition-colors" title={showPrices.normal ? "Sembunyikan" : "Tampilkan"}>
                  {showPrices.normal ? <Icons.Eye className="w-5 h-5" /> : <Icons.EyeOff className="w-5 h-5" />}
                </button>
              </div>
              {!showPrices.normal && <div className="flex items-center gap-2 mt-2 text-xs font-semibold text-amber-700 dark:text-amber-400 bg-amber-50 dark:bg-amber-900/20 w-fit px-2 py-1 rounded-md">🔒 Harga disembunyikan</div>}
            </div>
            <div className="input-underline">
              <Label>Harga Express / m²</Label>
              <div className="relative">
                <Input type="number" value={settings.express} onChange={e => setSettings({...settings, express: e.target.value})} className={`pr-10 ${!showPrices.express ? 'masked-text' : ''}`} />
                <button onClick={() => setShowPrices({...showPrices, express: !showPrices.express})} className="absolute right-2 top-1/2 -translate-y-1/2 text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 transition-colors" title={showPrices.express ? "Sembunyikan" : "Tampilkan"}>
                  {showPrices.express ? <Icons.Eye className="w-5 h-5" /> : <Icons.EyeOff className="w-5 h-5" />}
                </button>
              </div>
              {!showPrices.express && <div className="flex items-center gap-2 mt-2 text-xs font-semibold text-amber-700 dark:text-amber-400 bg-amber-50 dark:bg-amber-900/20 w-fit px-2 py-1 rounded-md">🔒 Harga disembunyikan</div>}
            </div>
            <div className="input-underline">
              <Label>Tambahan Biaya Desain (Rp)</Label>
              <Input type="number" value={settings.desain} onChange={e => setSettings({...settings, desain: e.target.value})} placeholder="0" />
            </div>
          </div>
        </CardContent>
      </Card>

      <Card>
        <CardHeader><CardTitle>Detail Item Pesanan</CardTitle></CardHeader>
        <CardContent>
          <div className="overflow-x-auto rounded-lg border border-slate-200 dark:border-slate-700">
            <table className="w-full text-sm min-w-[700px]">
              <thead>
                <tr className="bg-slate-900 dark:bg-slate-800 text-white">
                  <th className="p-3 text-left font-semibold text-xs uppercase tracking-wider rounded-tl-lg">Jenis</th>
                  <th className="p-3 text-left font-semibold text-xs uppercase tracking-wider">Lebar (cm)</th>
                  <th className="p-3 text-left font-semibold text-xs uppercase tracking-wider">Tinggi (cm)</th>
                  <th className="p-3 text-left font-semibold text-xs uppercase tracking-wider">Qty</th>
                  <th className="p-3 text-left font-semibold text-xs uppercase tracking-wider">Luas / Info</th>
                  <th className="p-3 text-left font-semibold text-xs uppercase tracking-wider">Total</th>
                  <th className="p-3 text-center font-semibold text-xs uppercase tracking-wider rounded-tr-lg">Aksi</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-200 dark:divide-slate-700 bg-white dark:bg-slate-900">
                {items.map((item) => {
                  const isFixed = item.jenis === 'Y Banner' || item.jenis === 'Roll Banner';
                  const l = parseFloat(item.lebar) || 0;
                  const t = parseFloat(item.tinggi) || 0;
                  const qty = parseFloat(item.qty) || 0;
                  let luasDisplay = "-";
                  let hargaDisplay = "Rp0";

                  if (isFixed) {
                    const ukuran = UKURAN_FIXED[item.jenis];
                    luasDisplay = <span className="inline-block bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 px-2 py-1 rounded-md text-xs font-bold">{ukuran.lebar}×{ukuran.tinggi} cm</span>;
                    hargaDisplay = formatCurrency(qty * HARGA_TETAP[item.jenis]);
                  } else {
                    const luasExact = (l / 100) * (t / 100) * qty;
                    luasDisplay = `${luasExact.toFixed(2)} m²`;
                    const lRound = roundUpTo50(l);
                    const tRound = roundUpTo50(t);
                    const luasRounded = (lRound / 100) * (tRound / 100) * qty;
                    const hargaPerM2 = item.jenis === 'Normal' ? (parseFloat(settings.normal) || 0) : (parseFloat(settings.express) || 0);
                    hargaDisplay = formatCurrency(luasRounded * hargaPerM2);
                  }

                  return (
                    <tr key={item.id} className="hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
                      <td className="p-2">
                        <select value={item.jenis} onChange={(e) => updateItem(item.id, 'jenis', e.target.value)} className="w-full rounded-md border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-2 py-1.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                          <option value="Normal">Normal</option>
                          <option value="Express">Express</option>
                          <option value="Y Banner">Y Banner</option>
                          <option value="Roll Banner">Roll Banner</option>
                        </select>
                      </td>
                      <td className="p-2">{!isFixed ? <Input type="number" value={item.lebar} onChange={(e) => updateItem(item.id, 'lebar', e.target.value)} placeholder="0" className="h-9 text-center" /> : <span className="text-slate-400 text-xs">Fixed</span>}</td>
                      <td className="p-2">{!isFixed ? <Input type="number" value={item.tinggi} onChange={(e) => updateItem(item.id, 'tinggi', e.target.value)} placeholder="0" className="h-9 text-center" /> : <span className="text-slate-400 text-xs">Fixed</span>}</td>
                      <td className="p-2"><Input type="number" value={item.qty} onChange={(e) => updateItem(item.id, 'qty', e.target.value)} min="1" className="h-9 text-center" /></td>
                      <td className="p-2 font-semibold text-blue-600 dark:text-blue-400 text-xs">{luasDisplay}</td>
                      <td className="p-2 font-bold text-slate-900 dark:text-white text-xs">{hargaDisplay}</td>
                      <td className="p-2 text-center">
                        <button onClick={() => removeItem(item.id)} className="w-8 h-8 rounded-lg bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 hover:bg-red-500 hover:text-white transition-all flex items-center justify-center mx-auto">
                          <Icons.Trash className="w-4 h-4" />
                        </button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          <Button variant="outline" className="w-full mt-4 border-2 border-dashed border-blue-500 text-blue-600 dark:text-blue-400 hover:bg-blue-50 dark:hover:bg-blue-900/20 hover:border-solid font-bold" onClick={addItem}>
            <Icons.Plus className="w-4 h-4 mr-2" /> Tambah Item
          </Button>
        </CardContent>
      </Card>

      <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
        <Card className="p-4 text-center hover:-translate-y-1 transition-transform">
          <h3 className="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Total Item</h3>
          <h2 className="text-2xl font-black text-blue-600 dark:text-blue-400">{calculations.totalItem}</h2>
        </Card>
        <Card className="p-4 text-center hover:-translate-y-1 transition-transform">
          <h3 className="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Total Luas Banner</h3>
          <h2 className="text-2xl font-black text-blue-600 dark:text-blue-400">{calculations.totalLuasExact.toFixed(2)} m²</h2>
        </Card>
        <Card className="p-4 text-center hover:-translate-y-1 transition-transform">
          <h3 className="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Biaya Desain</h3>
          <h2 className="text-2xl font-black text-blue-600 dark:text-blue-400">{formatCurrency(settings.desain)}</h2>
        </Card>
        <Card className="p-4 text-center hover:-translate-y-1 transition-transform border-green-200 dark:border-green-800 bg-green-50/50 dark:bg-green-900/10">
          <h3 className="text-xs font-bold text-green-700 dark:text-green-400 uppercase tracking-wider mb-2">Total Tagihan</h3>
          <h2 className="text-2xl font-black text-green-600 dark:text-green-400">{formatCurrency(calculations.grandTotalJual)}</h2>
        </Card>
      </div>

      {/* TOMBOL BARU: Terapkan ke Form */}
      <div className="text-center mt-4">
        <Button className="h-14 px-8 text-base font-bold rounded-xl shadow-lg shadow-blue-500/30 bg-blue-600 hover:bg-blue-700 text-white w-full md:w-auto" onClick={applyPriceToForm}>
          <Icons.FileText className="w-5 h-5 mr-2" /> Terapkan Harga ke Form Pesanan & Kembali
        </Button>
        <p className="text-xs text-slate-500 dark:text-slate-400 mt-2">Klik ini untuk otomatis mengisi "Total Harga" di tab Form Pesanan dan kembali ke halaman tersebut.</p>
      </div>

      <div className="text-center mt-8">
        <Button className="btn-margin h-14 px-12 text-base font-bold rounded-full shadow-lg shadow-green-500/30" onClick={openMarginPopup}>
          <Icons.Calculator className="w-5 h-5 mr-2" /> Hitung Margin Keuntungan
        </Button>
      </div>

      <Dialog open={showMarginPopup} onClose={() => setShowMarginPopup(false)} title="Rincian Margin Keuntungan" maxWidth="max-w-md">
        <div className="space-y-4">
          <div className="flex justify-between py-3 border-b border-slate-200 dark:border-slate-800">
            <p className="text-sm text-slate-600 dark:text-slate-400 font-medium">Total Modal (Partnership)</p>
            <b className="text-slate-900 dark:text-white">{formatCurrency(calculations.totalModal)}</b>
          </div>
          <div className="flex justify-between py-3 border-b border-slate-200 dark:border-slate-800">
            <p className="text-sm text-slate-600 dark:text-slate-400 font-medium">Biaya Desain</p>
            <b className="text-slate-900 dark:text-white">{formatCurrency(settings.desain)}</b>
          </div>
          <div className="flex justify-between py-3 border-b border-slate-200 dark:border-slate-800">
            <p className="text-sm text-slate-600 dark:text-slate-400 font-medium">Total Tagihan (Customer)</p>
            <b className="text-slate-900 dark:text-white">{formatCurrency(calculations.grandTotalJual)}</b>
          </div>
          <div className="flex justify-between py-3 border-b border-slate-200 dark:border-slate-800">
            <p className="text-sm text-slate-600 dark:text-slate-400 font-medium">Keuntungan Bersih</p>
            <b className={calculations.untung >= 0 ? 'profit-positive' : 'profit-negative'}>{formatCurrency(calculations.untung)}</b>
          </div>
          <div className="flex justify-between py-3">
            <p className="text-sm text-slate-600 dark:text-slate-400 font-medium">Margin (%)</p>
            <b className="text-blue-600 dark:text-blue-400 font-bold">{calculations.margin}%</b>
          </div>

          <div className="mt-6 pt-4 border-t-2 border-dashed border-slate-200 dark:border-slate-700">
            <h4 className="text-xs font-black text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-3">📋 Rincian Per Item</h4>
            <div className="space-y-3 max-h-48 overflow-y-auto scrollbar-thin pr-2">
              {calculations.detailRows.length === 0 ? (
                <p className="text-center text-slate-400 text-sm py-4">Belum ada item</p>
              ) : calculations.detailRows.map((row, idx) => (
                <div key={idx} className="space-y-1">
                  <div className="flex justify-between text-sm">
                    <span className="font-semibold text-slate-900 dark:text-white">{row.idx}. {row.jenis} × {row.qty}</span>
                    <span className="font-bold text-slate-900 dark:text-white">{formatCurrency(row.jualBaris)}</span>
                  </div>
                  <div className="flex justify-between text-[11px] text-slate-500 dark:text-slate-400 pl-4">
                    <span>{row.infoUkuran} | Modal: {formatCurrency(row.modalBaris)}</span>
                  </div>
                </div>
              ))}
            </div>
          </div>
          
          <div className="grid grid-cols-2 gap-3 mt-6">
            <Button className="btn-download h-12 font-bold" onClick={handleDownload}>
              <Icons.Download className="w-4 h-4 mr-2" /> Download
            </Button>
            <Button variant="outline" className="h-12 font-bold bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900 hover:bg-slate-800 dark:hover:bg-slate-200 border-0" onClick={() => setShowMarginPopup(false)}>
              Tutup
            </Button>
          </div>
        </div>
      </Dialog>
    </div>
  );
};

// 3. INCOME PAGE
const IncomePage = () => {
  const { unlockedTabs, setUnlockedTabs, toast } = useContext(AuthContext);
  const [password, setPassword] = useState('');
  const [showModal, setShowModal] = useState(false);
  const [selectedOrder, setSelectedOrder] = useState(null);
  const [materialCost, setMaterialCost] = useState('');
  const [shippingCost, setShippingCost] = useState('');
  const [orders, setOrders] = useState([]);
  const [incomeData, setIncomeData] = useState([]);
  const [loading, setLoading] = useState(true);

  const isUnlocked = unlockedTabs.includes('income');

  useEffect(() => {
    if (isUnlocked) {
      setLoading(true);
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate() + 1);
      const unsubscribeOrders = db.collection('orders').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
        setOrders(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).filter(o => { const d = new Date(o.createdAt); return d >= today && d < tomorrow; }));
      });
      const unsubscribeIncome = db.collection('income').onSnapshot(snapshot => {
        setIncomeData(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        setLoading(false);
      });
      return () => { unsubscribeOrders(); unsubscribeIncome(); };
    }
  }, [isUnlocked]);

  const handleLogin = () => {
    if (password === 'bilal100%') { setUnlockedTabs([...unlockedTabs, 'income']); toast('Income unlocked!', 'success'); } 
    else { toast('Password salah!', 'error'); }
  };

  const openIncomeModal = (order) => { setSelectedOrder(order); setMaterialCost(''); setShippingCost(''); setShowModal(true); };

  const saveIncome = async () => {
    if (!selectedOrder) return;
    const price = parseInt(selectedOrder.totalPrice || 0);
    const material = parseInt(materialCost || 0);
    const shipping = parseInt(shippingCost || 0);
    const profit = price - (material + shipping);
    const now = new Date();
    try {
      await db.collection('income').add({ orderId: selectedOrder.id, orderNumber: selectedOrder.orderNumber, price, material, shipping, profit, date: now.toISOString(), monthKey: `${now.getMonth()}-${now.getFullYear()}` });
      setShowModal(false); toast('Laba berhasil disimpan ke Firebase!', 'success');
    } catch (error) { toast('Gagal menyimpan laba', 'error'); }
  };

  const deleteOrder = async (id) => {
    if (!confirm('Hapus pesanan ini dari Firebase?')) return;
    try {
      await db.collection('orders').doc(id).delete();
      const incToDelete = incomeData.filter(inc => inc.orderId === id);
      if (incToDelete.length > 0) { const batch = db.batch(); incToDelete.forEach(inc => batch.delete(db.collection('income').doc(inc.id))); await batch.commit(); }
      toast('Pesanan dihapus dari Firebase', 'success');
    } catch (error) { toast('Gagal menghapus', 'error'); }
  };

  if (!isUnlocked) {
    return (
      <div className="max-w-md mx-auto mt-20 animate-fadeInUp">
        <Card><CardContent className="p-8 text-center space-y-4">
          <div className="w-16 h-16 mx-auto rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center"><Icons.Lock className="w-8 h-8 text-slate-400" /></div>
          <h3 className="text-xl font-bold text-slate-900 dark:text-white">Akses Income</h3>
          <Input type="password" placeholder="Masukkan Password" value={password} onChange={e => setPassword(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleLogin()} />
          <Button className="w-full" onClick={handleLogin}>Login</Button>
        </CardContent></Card>
      </div>
    );
  }

  const monthlyData = incomeData.filter(inc => inc.monthKey === `${new Date().getMonth()}-${new Date().getFullYear()}`).sort((a,b) => new Date(b.date) - new Date(a.date));
  const monthlyTotal = monthlyData.reduce((sum, i) => sum + i.profit, 0);

  return (
    <div className="space-y-6 max-w-6xl mx-auto animate-fadeInUp">
      <div className="flex justify-between items-center">
        <h1 className="text-3xl font-bold text-slate-900 dark:text-white">💰 Income & Laporan</h1>
        <Button variant="outline" className="btn-logout" onClick={() => setUnlockedTabs(unlockedTabs.filter(t => t !== 'income'))}><Icons.Logout className="w-4 h-4 mr-2" /> Logout</Button>
      </div>
      {loading ? <div className="text-center py-12"><div className="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div><p className="text-slate-500 dark:text-slate-400">Memuat data dari Firebase...</p></div> : (
        <>
          <Card>
            <CardHeader><CardTitle>Semua Pesanan Hari Ini</CardTitle></CardHeader>
            <CardContent>
              <div className="overflow-x-auto">
                <table className="w-full text-sm">

// 5. TRACK ORDER PAGE
const TrackPage = () => {
  const { toast } = useContext(ToastContext);
  const [searchQuery, setSearchQuery] = useState('');
  const [trackData, setTrackData] = useState(null);
  const [loading, setLoading] = useState(false);
  const [notFound, setNotFound] = useState(false);
  const [manualPrice, setManualPrice] = useState('');

  const trackOrder = async () => {
    if (!searchQuery.trim()) return;
    setLoading(true); setTrackData(null); setNotFound(false); setManualPrice('');
    try {
      let found = null;
      const ordersSnap = await db.collection('orders').where('orderNumber', '==', searchQuery).limit(1).get();
      if (!ordersSnap.empty) found = { id: ordersSnap.docs[0].id, ...ordersSnap.docs[0].data(), source: 'orders' };
      else {
        const vmmpSnap = await db.collection('vmmp').where('nomor_order', '==', searchQuery).limit(1).get();
        if (!vmmpSnap.empty) {
          const d = vmmpSnap.docs[0].data();
          found = { id: vmmpSnap.docs[0].id, ...d, source: 'vmmp', orderNumber: d.nomor_order, customer: { name: d.nama_pemesan || '-', whatsapp: d.whatsapp || '-', address: d.alamat || '-', city: d.kota || '-' }, items: (d.pesanan || []).map(p => ({ category: p.kategori_cetak || p.item || 'Lainnya', size: p.ukuran || '', quantity: p.jumlah || 1, unit: p.satuan || 'pcs', design: p.desain || '-', notes: p.keterangan || '', type: 'printing' })), totalPrice: d.total_price || '0', orderType: 'printing', status: d.status || 'baru' };
        }
      }
      if (!found) {
        const vmmlSnap = await db.collection('vmml').where('nomor_pemesanan', '==', searchQuery).limit(1).get();
        if (!vmmlSnap.empty) {
          const d = vmmlSnap.docs[0].data();
          let hargaPaket = 0;
          if (d.paket?.includes('Temen')) hargaPaket = 500000; else if (d.paket?.includes('Orang Dalam')) hargaPaket = 300000; else if (d.paket?.includes('Bestie')) hargaPaket = 3500000;
          found = { id: vmmlSnap.docs[0].id, ...d, source: 'vmml_logo', totalPrice: hargaPaket.toString(), orderType: 'design', status: d.status || 'baru', customer: { name: d.nama || '-', whatsapp: d.whatsapp || '-', address: '-', city: '-' }, items: [{ category: 'Desain Logo', size: '', quantity: 1, unit: 'pcs', design: d.paket || 'Logo Design', notes: `Brand: ${d.brand||'-'}\nSlogan: ${d.slogan||'-'}\nCerita Usaha:\n${d.cerita_usaha||'-'}\nWarna dan Gaya: ${d.warna_gaya||'-'}\nStyle: ${d.style_dominan||'-'}\nCatatan: ${d.catatan||'-'}`, type: 'design' }] };
        }
      }
      if (found) { setTrackData(found); if (found.source === 'vmmp') setManualPrice(found.totalPrice || ''); } else { setNotFound(true); }
    } catch (error) { toast('Gagal mencari data', 'error'); }
    setLoading(false);
  };

  const sendTrackWA = async (type) => {
    if (!trackData) return;
    const customerName = (trackData.customer?.name || trackData.nama_pemesan || trackData.nama || 'Customer').split(' ')[0];
    const whatsapp = trackData.customer?.whatsapp || trackData.whatsapp;
    if (!whatsapp) return toast('Nomor WA tidak ditemukan!', 'error');
    let totalPrice = trackData.totalPrice || '0';
    const orderNumber = trackData.orderNumber || trackData.nomor_order || trackData.nomor_pemesanan;
    
    if (trackData.source === 'vmmp') {
      if (manualPrice && manualPrice !== '0') totalPrice = manualPrice;
      try {
        await db.collection('vmmp').doc(trackData.id).update({ total_price: totalPrice, updatedAt: new Date().toISOString() });
        await db.collection('orders').add({ orderNumber, customer: trackData.customer, items: trackData.items, totalPrice, orderType: 'printing', status: type === 'konfirmasi' ? 'lunas' : 'baru', source: 'vmmp', createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), ...(type === 'konfirmasi' ? { paidAt: new Date().toISOString() } : {}) });
      } catch (e) { console.error("VMMP Sync Error:", e); }
    } else if (trackData.id) {
      const updateData = type === 'konfirmasi' ? { status: 'lunas', paidAt: new Date().toISOString(), updatedAt: new Date().toISOString() } : { updatedAt: new Date().toISOString() };
      const targetCollection = trackData.source === 'vmml_logo' ? 'vmml' : 'orders';
      await db.collection(targetCollection).doc(trackData.id).update(updateData);
      if (trackData.source === 'vmml_logo' && type === 'konfirmasi') await db.collection('orders').add({ orderNumber, customer: trackData.customer, items: trackData.items, totalPrice, orderType: 'design', status: 'lunas', source: 'vmml_logo', createdAt: new Date().toISOString(), paidAt: new Date().toISOString() });
    }
    if (type === 'konfirmasi') setTrackData({ ...trackData, status: 'lunas' });
    
    const totalFmt = parseInt(totalPrice).toLocaleString('id-ID');
    const link = type === 'tagihan' ? `https://www.visualku.com/p/invoiceku.html?id=${orderNumber}` : `https://www.visualku.com/p/paidoff.html?id=${orderNumber}`;
    let itemsText = (trackData.items || []).map((it, i) => `${i+1}. ${it.category} ${it.size ? '('+it.size+')' : ''}\n   Qty: ${it.quantity} ${it.unit}`).join('\n');
    let msg = `Halo ${customerName}!\n\nTerima kasih telah memesan di VisualKu.\n\nDETAIL ORDER\n------------------\nNomor Order: ${orderNumber}\nStatus: ${type === 'tagihan' ? 'Menunggu Pembayaran' : 'LUNAS - PROSES DIMULAI'}\n------------------\n\nDAFTAR PESANAN:\n${itemsText}\n\nRINCIAN PEMBAYARAN\n------------------\nTotal: Rp ${totalFmt}\n------------------\n\nLINK: ${link}\n\nMETODE PEMBAYARAN:\n- BCA: 5135365049 a/n MUHAMAD FAJAR\n- DANA: 085183147214 a/n MUHAMAD FAJAR\n\nTerima kasih atas kepercayaannya!\nTim VisualKu\nPT. VISUALKU META MEDIA`;
    
    window.open(`https://wa.me/${formatWhatsAppNumber(whatsapp)}?text=${encodeURIComponent(msg)}`, '_blank');
    toast(type === 'tagihan' ? 'Tagihan terkirim!' : type === 'konfirmasi' ? 'Konfirmasi terkirim!' : 'Ucapan terima kasih terkirim!', 'success');
  };

  return (
    <div className="space-y-6 max-w-4xl mx-auto animate-fadeInUp">
      <div><h1 className="text-3xl font-bold text-slate-900 dark:text-white mb-2">🔍 Track Order</h1><p className="text-slate-500 dark:text-slate-400">Cari pesanan berdasarkan nomor order (VMMP, VMML, atau Regular)</p></div>
      <Card><CardContent className="p-6">
        <div className="flex flex-col sm:flex-row gap-4">
          <Input placeholder="Contoh: VMMP-12345010426 atau VMML-xxxxx" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} onKeyDown={e => e.key === 'Enter' && trackOrder()} className="flex-1 h-14 text-lg font-semibold" />
          <Button className="btn-search h-14 px-8 text-lg font-bold" onClick={trackOrder} disabled={loading}>{loading ? 'Mencari...' : <><Icons.Search className="w-5 h-5 mr-2" /> Cari Order</>}</Button>
        </div>
      </CardContent></Card>
      {loading && <div className="text-center py-12"><div className="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div><p className="text-slate-500 dark:text-slate-400">Mencari data di Firebase...</p></div>}
      {notFound && !loading && <Card className="border-red-200 dark:border-red-900 bg-red-50 dark:bg-red-900/10"><CardContent className="p-12 text-center"><div className="w-20 h-20 bg-red-100 dark:bg-red-900/30 rounded-full flex items-center justify-center mx-auto mb-4"><Icons.Search className="w-10 h-10 text-red-600 dark:text-red-400" /></div><h3 className="text-xl font-bold text-slate-900 dark:text-white mb-2">Order Tidak Ditemukan</h3><p className="text-slate-600 dark:text-slate-400">Nomor pesanan yang Anda masukkan tidak terdaftar dalam sistem.</p></CardContent></Card>}
      {trackData && !loading && (
        <Card className="border-2 border-blue-100 dark:border-blue-900 animate-fadeInUp">
          <CardContent className="p-6 sm:p-8">
            <div className="flex justify-between items-start mb-6 flex-wrap gap-4"><div><h3 className="text-xl font-bold text-slate-900 dark:text-white mb-1">Detail Pesanan Ditemukan</h3><p className="text-slate-600 dark:text-slate-400 font-mono">{trackData.orderNumber || trackData.nomor_order || trackData.nomor_pemesanan}</p></div><StatusBadge status={trackData.status} /></div>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 p-4 bg-slate-50 dark:bg-slate-800/50 rounded-xl border border-slate-100 dark:border-slate-800">
              <div><p className="text-xs text-slate-500 dark:text-slate-400 mb-1">Nama</p><p className="font-semibold text-slate-900 dark:text-white">{trackData.customer?.name || '-'}</p></div>
              <div><p className="text-xs text-slate-500 dark:text-slate-400 mb-1">WhatsApp</p><p className="font-semibold text-slate-900 dark:text-white">{trackData.customer?.whatsapp || '-'}</p></div>
              <div className="md:col-span-2"><p className="text-xs text-slate-500 dark:text-slate-400 mb-1">Alamat</p><p className="font-semibold text-slate-900 dark:text-white">{trackData.customer?.address || '-'}</p></div>
              <div className="md:col-span-2"><p className="text-xs text-slate-500 dark:text-slate-400 mb-1">Kota</p><p className="font-semibold text-slate-900 dark:text-white">{trackData.customer?.city || '-'}</p></div>
            </div>
            <div className="mb-6">
              <h4 className="font-bold text-slate-900 dark:text-white mb-3">Item Pesanan</h4>
              <div className="space-y-3">{(trackData.items || []).map((item, index) => (<div key={index} className="p-4 bg-slate-50 dark:bg-slate-800/50 rounded-lg border border-slate-100 dark:border-slate-700"><div className="font-bold text-slate-900 dark:text-white mb-2">{index + 1}. {item.category} {item.size ? `(${item.size})` : ''}</div><div className="text-sm text-slate-600 dark:text-slate-400 space-y-1"><div><strong>Jumlah:</strong> {item.quantity} {item.unit}</div><div><strong>Desain:</strong> {item.design}</div>{item.notes && <div className="mt-2 pt-2 border-t border-slate-200 dark:border-slate-700"><strong>Detail:</strong><br/><span dangerouslySetInnerHTML={{__html: item.notes.replace(/\n/g, '<br/>')}} /></div>}</div></div>))}</div>
            </div>
            {trackData.source === 'vmmp' && (
              <div className="mb-6 p-4 bg-blue-50 dark:bg-blue-900/20 rounded-xl border-2 border-blue-200 dark:border-blue-800">
                <Label>Atur Harga Manual (Khusus VMMP)</Label>
                <Input type="number" value={manualPrice} onChange={e => setManualPrice(e.target.value)} className="text-2xl font-black border-blue-300 dark:border-blue-700 dark:bg-slate-800 dark:text-white focus:ring-blue-500" placeholder="Masukkan total harga dalam Rupiah" />
                <p className="text-xs text-slate-500 dark:text-slate-400 mt-2">Harga ini akan digunakan untuk tagihan & konfirmasi. Order akan disinkronkan ke koleksi 'orders' untuk laporan Income.</p>
              </div>
            )}
            <div className="flex justify-between items-center p-4 bg-blue-50 dark:bg-blue-900/20 rounded-xl mb-6 border border-blue-100 dark:border-blue-800">
              <span className="font-bold text-slate-700 dark:text-slate-200">Total Pembayaran</span>
              <span className="text-2xl font-black text-blue-600 dark:text-blue-400">{formatCurrency(trackData.source === 'vmmp' ? (manualPrice || 0) : (trackData.totalPrice || 0))}</span>
            </div>
            <div className="grid grid-cols-3 gap-3">
              <Button className="btn-tagihan h-14 font-black" onClick={() => sendTrackWA('tagihan')}>Tagihan</Button>
              <Button className="btn-konfirmasi h-14 font-black" onClick={() => sendTrackWA('konfirmasi')}>Konfirmasi</Button>
              <Button className="btn-terimakasih h-14 font-black" onClick={() => sendTrackWA('terimakasih')}>Terima Kasih</Button>
            </div>
          </CardContent>
        </Card>
      )}
    </div>
  );
};

// ==================== MAIN APP ====================
const App = () => {
  const [user, setUser] = useState(null);
  const [currentPage, setCurrentPage] = useState('form');
  const [sidebarOpen, setSidebarOpen] = useState(true);
  const [darkMode, setDarkMode] = useState(localStorage.getItem('darkMode') === 'true');
  const [unlockedTabs, setUnlockedTabs] = useState([]);
  const [toasts, setToasts] = useState([]);

  useEffect(() => {
    if (darkMode) document.documentElement.classList.add('dark');
    else document.documentElement.classList.remove('dark');
    localStorage.setItem('darkMode', darkMode);
  }, [darkMode]);

  const toast = (message, type = 'info') => {
    const id = genId();
    setToasts(t => [...t, { id, message, type }]);
  };
  const removeToast = (id) => setToasts(t => t.filter(x => x.id !== id));
  const logout = () => { setUser(null); setCurrentPage('form'); setUnlockedTabs([]); };

  if (!user) {
    return (
      <AuthContext.Provider value={{ user, logout, unlockedTabs, setUnlockedTabs, toast }}>
        <ToastContext.Provider value={{ toast }}>
          <LoginPage onLogin={setUser} />
          <div className="fixed bottom-4 right-4 z-50 space-y-2">
            {toasts.map(t => <Toast key={t.id} {...t} onClose={() => removeToast(t.id)} />)}
          </div>
        </ToastContext.Provider>
      </AuthContext.Provider>
    );
  }

  return (
    <FormProvider>
      <AuthContext.Provider value={{ user, logout, unlockedTabs, setUnlockedTabs, toast }}>
        <UIContext.Provider value={{ sidebarOpen, setSidebarOpen, darkMode, setDarkMode, currentPage, setCurrentPage }}>
          <ToastContext.Provider value={{ toast }}>
            <div className="min-h-screen bg-slate-50 dark:bg-slate-950 transition-colors duration-300">
              <Sidebar />
              <div className={`transition-all duration-300 ${sidebarOpen ? 'lg:ml-64' : 'lg:ml-16'}`}>
                <Topbar />
                <main className="p-4 sm:p-6 lg:p-8">
                  {currentPage === 'form' && <FormPage />}
                  {currentPage === 'kasir' && <KasirPage />}
                  {currentPage === 'income' && <IncomePage />}
                  {currentPage === 'vendor' && <VendorPage />}
                  {currentPage === 'track' && <TrackPage />}
                </main>
                <footer className="py-8 text-center text-slate-400 dark:text-slate-600 text-[10px] font-black tracking-[0.3em] uppercase border-t border-slate-200 dark:border-slate-800 px-4">
                  &copy; 2026 PT. VISUALKU META MEDIA
                </footer>
              </div>
              <div className="fixed bottom-4 right-4 z-50 space-y-2">
                {toasts.map(t => <Toast key={t.id} {...t} onClose={() => removeToast(t.id)} />)}
              </div>
            </div>
          </ToastContext.Provider>
        </UIContext.Provider>
      </AuthContext.Provider>
    </FormProvider>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
